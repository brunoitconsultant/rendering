<!DOCTYPE html>
<html>
<body>
  <canvas id="screen" width="640" height="480" style="background:#000; display:block; margin-bottom:10px;"></canvas>

  <div style="background:#000; color:#fff; width:640px; height:30px; display:flex; align-items:center; padding-left:10px; font-family:monospace;">Hello!
</div>

  <script>
    const width = 640;
    const height = 480;
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    
    const canvasImage = ctx.createImageData(width, height);
    let frame = 0;

WebAssembly.instantiateStreaming(fetch('renderer.wasm'))
  .then(result => {
    const exports = result.instance.exports;
    
    const memory = exports.memory || result.instance.memory; 
    const bufferPtr = exports.get_buffer_pointer();

    const totalBytes = width * height * 4;
    const pixelView = new Uint8ClampedArray(memory.buffer, bufferPtr, totalBytes);

    function loop() {
      exports.generate_frame(frame++);

      canvasImage.data.set(pixelView);
      ctx.putImageData(canvasImage, 0, 0);

      requestAnimationFrame(loop);
    }

    loop(); 
  });
  </script>
</body>
</html>
